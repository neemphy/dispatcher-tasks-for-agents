<rect x="10" y="10" width="880" height="396" rx="14" fill="#fbfbfe" stroke="#e4e4ee" filter="url(#sh)"/>
<g clip-path="url(#win)"><rect x="10" y="10" width="880" height="40" fill="#f0eff8"/><rect x="10" y="50" width="880" height="1" fill="#e4e4ee"/></g>
<circle cx="34" cy="35" r="6" fill="#fca5a5"/><circle cx="54" cy="35" r="6" fill="#fcd34d"/><circle cx="74" cy="35" r="6" fill="#86efac"/>
<text x="450" y="40" text-anchor="middle" fill="#6b6b7b" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">agent — dispatcher demo</text>
<text class="t1" x="866" y="40" text-anchor="end" fill="#6b6b7b" font-size="12.5">clock 11:20</text>
<text class="t2" x="866" y="40" text-anchor="end" fill="#b45309" font-size="12.5" font-weight="700" opacity="0">clock 14:00</text>
<g class="scene">
<g class="l0"><text x="34.0" y="88" fill="#0284c7" textLength="40.5" lengthAdjust="spacing">you ›</text><text x="82.6" y="88" fill="#1f1d2e" textLength="324.0" lengthAdjust="spacing">Refactor the payment module, not urgent.</text><rect class="c0" x="32" y="73" width="376.6" height="21" fill="#fbfbfe"/><g class="k0"><rect class="b" x="32" y="74" width="8" height="18" fill="#6366f1"/></g></g>
<g class="l1"><text x="34.0" y="111" fill="#6b6b7b" textLength="364.5" lengthAdjust="spacing"># size L, normal urgency: put it in the queue</text></g>
<g class="l2"><text x="34.0" y="134" fill="#6366f1" textLength="8.1" lengthAdjust="spacing">$</text><text x="50.2" y="134" fill="#1f1d2e" textLength="720.9" lengthAdjust="spacing">python3 dispatcher.py queue add refactor-payments --brief-file brief.md --size L --normal</text><rect class="c2" x="32" y="119" width="741.1" height="21" fill="#fbfbfe"/><g class="k2"><rect class="b" x="32" y="120" width="8" height="18" fill="#6366f1"/></g></g>
<g class="l3"><text x="34.0" y="157" fill="#0284c7" textLength="48.6" lengthAdjust="spacing" font-weight="700">queued</text><text x="106.9" y="157" fill="#1f1d2e" textLength="283.5" lengthAdjust="spacing">refactor-payments  (size L, normal)</text></g>
<g class="l4"><text x="34.0" y="180" fill="#6366f1" textLength="8.1" lengthAdjust="spacing">$</text><text x="50.2" y="180" fill="#1f1d2e" textLength="259.2" lengthAdjust="spacing">python3 dispatcher.py queue list</text><rect class="c4" x="32" y="165" width="279.4" height="21" fill="#fbfbfe"/><g class="k4"><rect class="b" x="32" y="166" width="8" height="18" fill="#6366f1"/></g></g>
<g class="l5"><text x="34.0" y="203" fill="#b45309" textLength="56.7" lengthAdjust="spacing" font-weight="700">waiting</text><text x="106.9" y="203" fill="#1f1d2e" textLength="575.1" lengthAdjust="spacing">refactor-payments  claude: short window 85 % — waits for reset at 14:00</text></g>
<g class="l6"><text x="34.0" y="226" fill="#b45309" textLength="218.7" lengthAdjust="spacing" font-weight="700">… 14:00 — the window resets</text></g>
<g class="l7"><text x="34.0" y="249" fill="#6366f1" textLength="8.1" lengthAdjust="spacing">$</text><text x="50.2" y="249" fill="#1f1d2e" textLength="210.6" lengthAdjust="spacing">python3 dispatcher.py tick</text><rect class="c7" x="32" y="234" width="230.8" height="21" fill="#fbfbfe"/><g class="k7"><rect class="b" x="32" y="235" width="8" height="18" fill="#6366f1"/></g></g>
<g class="l8"><text x="34.0" y="272" fill="#6d5ae6" textLength="56.7" lengthAdjust="spacing" font-weight="700">running</text><text x="106.9" y="272" fill="#1f1d2e" textLength="445.5" lengthAdjust="spacing">refactor-payments  claude: window is free, starting now</text></g>
<g class="l9"><text x="34.0" y="295" fill="#6366f1" textLength="8.1" lengthAdjust="spacing">$</text><text x="50.2" y="295" fill="#1f1d2e" textLength="405.0" lengthAdjust="spacing">python3 dispatcher.py queue show refactor-payments</text><rect class="c9" x="32" y="280" width="425.2" height="21" fill="#fbfbfe"/><g class="k9"><rect class="b" x="32" y="281" width="8" height="18" fill="#6366f1"/></g></g>
<g class="l10"><text x="34.0" y="318" fill="#059669" textLength="32.4" lengthAdjust="spacing" font-weight="700">done</text><text x="106.9" y="318" fill="#1f1d2e" textLength="137.7" lengthAdjust="spacing">refactor-payments</text></g>
<g class="l11"><text x="34.0" y="341" fill="#6b6b7b" textLength="243.0" lengthAdjust="spacing">report: 0 errors, tests passed</text></g>
<g class="l12"><text x="34.0" y="364" fill="#6366f1" textLength="8.1" lengthAdjust="spacing">$</text><rect class="b k12" x="50.2" y="350" width="8" height="18" fill="#6366f1"/></g>
